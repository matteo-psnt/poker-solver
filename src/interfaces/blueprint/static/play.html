<!doctype html>
<!--
  The public table: a stranger plays heads-up against the blueprint.

  One self-contained file the blueprint server returns at `/`, so it ships in the
  code snapshot and the box needs no node toolchain. It speaks only `/api/run`
  and `/api/play*` -- the two route families Caddy lets through without a token --
  and the server strips the mix, the untrained marks and unshown bot cards on
  that route, so nothing here could display them even by mistake.

  Laid out like an online poker client on purpose: pods, a dealer chat, and a
  bet panel are what a player already knows how to read.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blueprint Heads-Up</title>
<meta name="description" content="Play heads-up No-Limit Hold'em against Blueprint, a poker bot trained by counterfactual regret minimisation.">
<meta name="theme-color" content="#141414">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 1Q21 9.5 28 16Q21 22.5 16 31Q11 22.5 4 16Q11 9.5 16 1Z' fill='%23c8161d'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #141414;
    --panel: #1e1e1e;
    --panel-2: #262626;
    --line: #333;
    --text: #f2f2f2;
    --dim: #9a9a9a;
    --felt-hi: #3f9a4f;
    --felt: #2b7a3a;
    --felt-lo: #1a5226;
    --red: #c8161d;
    --red-lo: #8e0f14;
    --gold: #ffcc33;
    --win: #6fdc6f;
    --lose: #ff6b6b;
    --s: #111; --h: #d0161d; --d: #1660d0; --c: #148a2c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 35%, #262626 0%, var(--bg) 70%);
    color: var(--text);
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---- title bar ----------------------------------------------------------- */
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 6px 14px; background: #0c0c0c; border-bottom: 1px solid #000;
    font-size: 13px; color: var(--dim);
  }
  .bar b { color: var(--text); }
  .bar .net.up { color: var(--win); } .bar .net.down { color: var(--lose); }
  .bar button { background: none; border: 0; color: var(--dim); text-decoration: underline; cursor: pointer; padding: 0 0 0 6px; font-size: 12px; }
  /* The two pages of this host, Play and Strategy (the chart at /chart), share
     this bar; `console/src/chart.css` draws the same one on the chart. */
  .bar { padding: 8px 16px; }
  .bar .site, .bar .end { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .bar .brand { display: flex; align-items: center; gap: 7px; color: var(--text); font-weight: 700; text-decoration: none; }
  .bar .brand svg { width: 11px; height: 14px; }
  .bar nav { display: flex; gap: 16px; padding-left: 14px; border-left: 1px solid #2c2c2c; }
  .bar nav a { color: var(--dim); text-decoration: none; font-weight: 600; }
  .bar nav a:hover { color: #d8d8d8; }
  .bar nav a[aria-current="page"] { color: var(--text); }
  .bar .blurb { padding-left: 14px; border-left: 1px solid #2c2c2c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .end > a { color: var(--dim); font-size: 12px; }
  @media (max-width: 640px) { .bar .blurb { display: none; } }

  /* ---- table --------------------------------------------------------------- */
  .stage { flex: 1; display: grid; place-items: center; padding: 34px 16px 30px; }
  .table {
    position: relative; width: min(100%, 860px); aspect-ratio: 2.05 / 1;
    border-radius: 999px; padding: 22px;
    background: linear-gradient(#4a4a4a, #1c1c1c 45%, #0a0a0a);
    box-shadow: inset 0 2px 1px rgba(255,255,255,.18), inset 0 -3px 6px rgba(0,0,0,.8), 0 18px 40px rgba(0,0,0,.7);
  }
  .felt {
    position: relative; height: 100%; border-radius: 999px;
    background: radial-gradient(ellipse at 50% 45%, var(--felt-hi) 0%, var(--felt) 50%, var(--felt-lo) 100%);
    box-shadow: inset 0 0 0 3px #111, inset 0 6px 24px rgba(0,0,0,.6);
  }
  .logo {
    position: absolute; left: 50%; top: 68%; transform: translate(-50%, -50%);
    font-weight: 800; font-size: 26px; letter-spacing: .02em; color: rgba(0,0,0,.18);
    pointer-events: none; white-space: nowrap;
  }

  /* ---- pods ---------------------------------------------------------------- */
  /* A seat is cards plus a pod. The bot's pod sits on the rail with its cards
     hanging into the felt in front of it; yours sits on the near rail with the
     cards standing up behind it, the way a client draws hero. */
  .seat {
    position: absolute; left: 50%; width: 180px; margin-left: -90px; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
  }
  .seat.top { top: -26px; }
  .seat.bottom { bottom: -26px; }
  .seat.bottom .holes .card { --w: 54px; }
  .holes { display: flex; justify-content: center; gap: 2px; }
  .seat.top .holes { order: 2; margin-top: 4px; position: relative; z-index: 2; }
  .seat.bottom .holes { margin-bottom: -10px; position: relative; z-index: 0; }
  .pod {
    position: relative; z-index: 1; width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 5px 10px 5px 5px; border-radius: 6px;
    background: linear-gradient(#323232, #161616); border: 1px solid #000;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 3px 8px rgba(0,0,0,.6);
  }
  .seat.active .pod { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 14px rgba(255,204,51,.4); }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-weight: 800; font-size: 15px;
    color: #fff; box-shadow: inset 0 0 0 2px #000;
  }
  .avatar.bot { background: #2f4f7a; }
  .avatar.you { background: #7a3a2f; }
  .who { min-width: 0; line-height: 1.25; }
  .who .name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .name.said { color: var(--gold); }
  .who .stack { font-size: 14px; color: #d8d8d8; font-variant-numeric: tabular-nums; }
  .dealer {
    position: absolute; width: 22px; height: 22px; border-radius: 50%; z-index: 3;
    background: #fff; color: #000; font-weight: 800; font-size: 12px;
    display: grid; place-items: center; box-shadow: 0 2px 3px rgba(0,0,0,.6), inset 0 0 0 2px #ccc;
    left: calc(50% + 104px);
  }
  .dealer[hidden] { display: none; }
  .dealer.top { top: 38px; }
  .dealer.bottom { bottom: 38px; }

  /* ---- cards --------------------------------------------------------------- */
  .card {
    --w: 46px;
    width: var(--w); height: calc(var(--w) * 1.42); border-radius: 4px; flex: none;
    background: #fff; position: relative; color: var(--s);
    box-shadow: 0 1px 3px rgba(0,0,0,.6); font-family: Arial, Helvetica, sans-serif;
  }
  .card .rk { position: absolute; left: 4px; top: 1px; font-weight: 700; font-size: calc(var(--w) * .5); line-height: 1; letter-spacing: -.04em; }
  .card .su { position: absolute; right: 3px; bottom: 1px; font-size: calc(var(--w) * .55); line-height: 1; }
  .card.s { color: var(--s); } .card.h { color: var(--h); } .card.d { color: var(--d); } .card.c { color: var(--c); }
  .card.back {
    background: repeating-linear-gradient(45deg, #b3141b 0 3px, #9a1117 3px 6px);
    box-shadow: inset 0 0 0 3px #fff, 0 1px 3px rgba(0,0,0,.6);
  }
  .card.slot { visibility: hidden; }
  .holes .card { --w: 44px; }
  .holes .card:first-child { transform: rotate(-3deg); }
  .holes .card:last-child { transform: rotate(3deg); }
  .board { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 4px; }
  .board .card { --w: 52px; }
  .card.dealt { animation: flip .22s ease-out both; }
  @keyframes flip { from { transform: scaleX(0); } to { transform: none; } }
  .holes .card.dealt { animation: none; }

  /* ---- pot and bets -------------------------------------------------------- */
  .pot {
    position: absolute; left: 50%; top: calc(50% - 64px); transform: translateX(-50%);
    font-weight: 700; font-size: 14px; color: #fff; white-space: nowrap;
    background: rgba(0,0,0,.45); padding: 2px 10px; border-radius: 10px; font-variant-numeric: tabular-nums;
  }
  .pot:empty { display: none; }
  .bet { position: absolute; left: 50%; display: flex; align-items: center; gap: 5px; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
  .bet.top { top: 21%; transform: translateX(-50%); }
  .bet.bottom { bottom: 21%; transform: translateX(-50%); }
  .bet:empty { display: none; }
  .bet span { background: rgba(0,0,0,.45); padding: 1px 7px; border-radius: 9px; }
  .chips { position: relative; width: 20px; }
  .chip {
    position: absolute; left: 0; width: 20px; height: 20px; border-radius: 50%;
    background: var(--cc);
    box-shadow: inset 0 0 0 3px var(--cc), inset 0 0 0 5px rgba(255,255,255,.85), inset 0 0 0 7px var(--cc), 0 1px 1px rgba(0,0,0,.7);
  }
  .banner {
    position: absolute; left: 50%; top: calc(50% - 70px); transform: translateX(-50%);
    background: rgba(0,0,0,.75); border: 1px solid var(--gold); color: var(--gold);
    font-weight: 700; font-size: 15px; padding: 4px 14px; border-radius: 4px; white-space: nowrap;
  }
  .banner:empty { display: none; }

  /* ---- dock: chat + actions ---------------------------------------------- */
  .dock {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 430px); gap: 12px;
    padding: 10px 14px 14px; background: #0c0c0c; border-top: 1px solid #000;
  }
  .chat {
    background: #050505; border: 1px solid var(--line); border-radius: 3px;
    height: 132px; overflow-y: auto; padding: 6px 8px; font-size: 12.5px; color: #c9c9c9;
  }
  .chat p { margin: 0 0 2px; }
  .chat .dealer-says { color: #8fb3ff; }
  .chat .you { color: #fff; font-weight: 700; }
  .chat .result { color: var(--gold); }
  .chat .muted { color: #6a6a6a; }
  .chat .r { color: #ff6b6b; } .chat .bl { color: #6ea2ff; } .chat .g { color: #5fd17a; }

  .actions { display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; }
  .presets { display: flex; gap: 4px; align-items: center; }
  .preset {
    flex: 1; background: linear-gradient(#4a4a4a, #2e2e2e); border: 1px solid #000; border-radius: 3px;
    padding: 4px 0; font-size: 12px; font-weight: 700; cursor: pointer; color: #eee;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
  }
  .preset[aria-pressed="true"] { background: linear-gradient(#6a6a6a, #4a4a4a); color: #fff; }
  .slide { display: flex; gap: 8px; align-items: center; }
  .slide input[type=range] { flex: 1; accent-color: var(--red); }
  .slide output {
    min-width: 76px; text-align: center; background: #fff; color: #000; border-radius: 3px;
    padding: 3px 6px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .big { display: flex; gap: 6px; }
  .btn {
    flex: 1; min-height: 50px; border: 1px solid #000; border-radius: 4px; cursor: pointer;
    background: linear-gradient(#e0262e, var(--red) 45%, var(--red-lo));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 2px 3px rgba(0,0,0,.6);
    color: #fff; font-weight: 700; font-size: 15px; line-height: 1.15; padding: 4px 6px;
    text-shadow: 0 1px 1px rgba(0,0,0,.5);
  }
  .btn small { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .btn:hover:not(:disabled) { filter: brightness(1.12); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { filter: grayscale(.8) brightness(.6); cursor: default; }
  .waiting { color: var(--dim); text-align: center; padding: 16px 0; }
  .alert { color: #ffb4b4; font-size: 12.5px; text-align: center; }
  .alert:empty { display: none; }

  @media (max-width: 720px) {
    .stage { padding: 40px 6px 40px; }
    .table { aspect-ratio: auto; height: min(132vw, 540px); width: 100%; border-radius: 48% / 26%; padding: 14px; }
    .felt { border-radius: 48% / 26%; }
    .logo { top: 66%; font-size: 20px; }
    .board .card { --w: 46px; }
    .board { gap: 3px; }
    .bet.top { top: 23%; } .bet.bottom { bottom: 23%; }
    .seat { width: 170px; }
    .dealer { left: calc(50% + 98px); }
    .dock { grid-template-columns: 1fr; }
    #stakes { display: none; }
    .chat { order: 2; height: 96px; }
  }
  @media (prefers-reduced-motion: reduce) { .card.dealt { animation: none; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="site">
      <a class="brand" href="/"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1Q21 9.5 28 16Q21 22.5 16 31Q11 22.5 4 16Q11 9.5 16 1Z" fill="#c8161d"/></svg>Blueprint</a>
      <nav><a aria-current="page" href="/">Play</a><a href="/chart">Strategy</a></nav>
      <span class="blurb">No-Limit Hold'em <span id="stakes"></span></span>
    </div>
    <div class="end">
      <div id="tally"></div>
      <a href="https://github.com/matteo-psnt/poker-solver">source</a>
    </div>
  </div>

  <div class="stage">
    <div class="table">
      <div class="felt">
        <div class="logo">BLUEPRINT</div>
        <div class="pot" id="pot"></div>
        <div class="bet top" id="bot-bet"></div>
        <div class="board" id="board"></div>
        <div class="banner" id="banner"></div>
        <div class="bet bottom" id="you-bet"></div>
      </div>
      <div class="seat top" id="bot-seat"></div>
      <div class="seat bottom" id="you-seat"></div>
      <div class="dealer" id="dealer" hidden>D</div>
    </div>
  </div>

  <div class="dock">
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="actions" id="actions"><div class="waiting">Connecting…</div></div>
  </div>

<script>
(() => {
  "use strict";

  const SUITS = { s: "♠", h: "♥", d: "♦", c: "♣" };
  const SUIT_CLASS = { s: "", h: "r", d: "bl", c: "g" };
  const STORE_KEY = "hu-blueprint-score";
  const $ = (id) => document.getElementById(id);

  let run = null;        // /api/run: blinds and the starting stack
  let hand = null;       // the current hand payload
  let handNo = 0;
  let busy = false;
  let pick = null;       // index into the size menu the slider points at
  let score = loadScore();
  let seen = new Set();  // board cards already drawn, so only new ones flip
  let error = "";

  function loadScore() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (parsed && Number.isFinite(parsed.hands) && Number.isFinite(parsed.chips)) return parsed;
    } catch (_) { /* private mode, blocked storage */ }
    return { hands: 0, chips: 0 };
  }
  function saveScore() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(score)); } catch (_) { /* ignore */ }
  }

  // ---- formatting ------------------------------------------------------------
  const bbOf = (chips) => chips / (run ? run.big_blind : 1);
  const num = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(1));
  const BB = (chips) => num(bbOf(chips)) + " BB";
  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function cardEl(card, key) {
    if (card === "back") return el("div", "card back");
    if (!card) return el("div", "card slot");
    const node = el("div", "card " + card[1]);
    node.setAttribute("role", "img");
    node.setAttribute("aria-label", card);
    node.append(el("span", "rk", card[0] === "T" ? "10" : card[0]), el("span", "su", SUITS[card[1]]));
    if (key && !seen.has(key + card)) { node.classList.add("dealt"); seen.add(key + card); }
    return node;
  }
  function cardText(card) {
    const span = el("span", SUIT_CLASS[card[1]], (card[0] === "T" ? "10" : card[0]) + SUITS[card[1]]);
    return span;
  }
  function chipsEl(chips) {
    const bb = bbOf(chips);
    const colour = bb >= 50 ? "#222" : bb >= 20 ? "#6a2ca0" : bb >= 5 ? "#1b8a3c" : bb >= 2 ? "#c8161d" : "#1f5fbf";
    const count = Math.max(1, Math.min(6, Math.ceil(Math.log2(bb + 1))));
    const stack = el("div", "chips");
    stack.style.height = 20 + (count - 1) * 3 + "px";
    for (let i = 0; i < count; i++) {
      const chip = el("div", "chip");
      chip.style.setProperty("--cc", colour);
      chip.style.bottom = i * 3 + "px";
      stack.append(chip);
    }
    return stack;
  }

  // ---- street commitments -------------------------------------------------------
  // The wire speaks Action.amount verbatim: a BET is the total, a RAISE is the
  // chips OVER the call, an ALL_IN is everything added. A player reads "raise to",
  // so the street's commitments are replayed from the log to say that.
  function blindsPut(btn) {
    const put = [0, 0];
    put[btn] = run.small_blind;
    put[1 - btn] = run.big_blind;
    return put;
  }
  function applyEvent(put, e) {
    const next = put.slice();
    const me = e.seat, opp = 1 - e.seat;
    if (e.action === "bet") next[me] += e.amount;
    else if (e.action === "raise") next[me] = put[opp] + e.amount;
    else if (e.action === "call") next[me] = Math.max(put[me], put[opp]);
    else if (e.action === "all_in") next[me] += e.amount;
    return next;
  }
  function streetCommitments(h) {
    let street = "preflop", put = blindsPut(h.button);
    for (const e of h.log) {
      if (e.street !== street) { street = e.street; put = [0, 0]; }
      put = applyEvent(put, e);
    }
    return h.street !== street ? [0, 0] : put;
  }
  // Words from the chips, not the action type: the engine calls the big blind's
  // raise over a limp a BET and a call of a shove an ALL_IN.
  function phrase(type, amount, put, me) {
    const opp = 1 - me;
    const after = applyEvent(put, { seat: me, action: type, amount })[me];
    switch (type) {
      case "fold": return "folds";
      case "check": return "checks";
      case "call": return "calls " + BB(put[opp] - put[me]);
      case "bet":
      case "raise": return (put[me] || put[opp] ? "raises to " : "bets ") + BB(after);
      case "all_in": return after <= put[opp] ? "calls all-in" : "is all-in for " + BB(after);
      default: return type;
    }
  }
  // "raises to 3 BB" -> "Raise to 3 BB" for the bubble over a seat.
  const short = (text) => text.replace("is all-in for", "all-in").replace(/^(\w+?)s\b/, "$1").replace(/^./, (c) => c.toUpperCase());

  // ---- network ----------------------------------------------------------------
  async function call(method, path, body) {
    const response = await fetch(path, {
      method,
      headers: body ? { "content-type": "application/json", accept: "application/json" } : { accept: "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    let payload = null;
    try { payload = await response.json(); } catch (_) { /* not json */ }
    if (!response.ok) {
      const message = (payload && (payload.error || payload.detail)) || `The table answered ${response.status}.`;
      const err = new Error(typeof message === "string" ? message : JSON.stringify(message));
      err.status = response.status;
      throw err;
    }
    return payload;
  }

  async function deal() {
    if (busy || !run) return;
    busy = true; render();
    const previous = hand && hand.session;
    try {
      const next = await call("POST", "/api/play", { human_seat: 0 });
      seen = new Set(); pick = null; handNo += 1;
      setHand(next);
      error = "";
      if (previous && previous !== next.session) call("DELETE", `/api/play/${encodeURIComponent(previous)}`).catch(() => {});
    } catch (err) {
      error = err.message;
    } finally {
      busy = false; render();
    }
  }

  async function act(token) {
    if (busy || !hand || hand.over) return;
    busy = true; render();
    try {
      setHand(await call("POST", `/api/play/${encodeURIComponent(hand.session)}/action`, { token }));
      pick = null; error = "";
    } catch (err) {
      if (err.status === 404) { hand = null; error = "That hand timed out on the server. Deal a new one."; }
      else error = err.message;
    } finally {
      busy = false; render();
    }
  }

  function setHand(next) {
    const wasOver = hand && hand.session === next.session && hand.over;
    hand = next;
    if (next.over && !wasOver && next.payoff != null) {
      score.hands += 1;
      score.chips += next.payoff;
      saveScore();
    }
  }

  // ---- rendering -------------------------------------------------------------
  function lastSaid(h, actor) {
    let put = blindsPut(h.button), street = "preflop", said = null;
    for (const e of h.log) {
      if (e.street !== street) { street = e.street; put = [0, 0]; }
      if (e.actor === actor) said = { text: short(phrase(e.action, e.amount, put, e.seat)), street: e.street };
      put = applyEvent(put, e);
    }
    return said && (said.street === h.street || h.over) ? said.text : "";
  }

  function seatEl(node, o) {
    node.replaceChildren();
    node.classList.toggle("active", Boolean(o.active));
    const holes = el("div", "holes");
    o.cards.forEach((c) => holes.append(cardEl(c)));
    const pod = el("div", "pod");
    const who = el("div", "who");
    who.append(el("div", o.said ? "name said" : "name", o.said || o.name), el("div", "stack", o.stack));
    pod.append(el("div", "avatar " + o.kind, o.name[0]), who);
    node.append(holes, pod);
  }

  function betEl(node, chips) {
    node.replaceChildren();
    if (chips > 0) node.append(chipsEl(chips), el("span", null, BB(chips)));
  }

  function renderBar() {
    if (run) $("stakes").textContent = `· Heads-up · Blinds ${num(bbOf(run.small_blind))}/1 BB · ${BB(run.starting_stack)} stacks`;
    const node = $("tally");
    node.replaceChildren();
    if (!score.hands) return;
    const v = bbOf(score.chips);
    node.append(
      "Session: ",
      el("b", "net " + (v > 0 ? "up" : v < 0 ? "down" : ""), (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v)) + " BB"),
      ` over ${score.hands} ${score.hands === 1 ? "hand" : "hands"}`,
    );
    const reset = el("button", null, "Reset");
    reset.onclick = () => { score = { hands: 0, chips: 0 }; saveScore(); render(); };
    node.append(reset);
  }

  function render() {
    renderBar();
    const actions = $("actions");
    actions.replaceChildren();
    if (!run) {
      actions.append(el("div", "waiting", error || "Connecting…"));
      return;
    }

    if (!hand) {
      const stack = BB(run.starting_stack);
      seatEl($("bot-seat"), { name: "Blueprint", kind: "bot", stack, cards: [null, null] });
      seatEl($("you-seat"), { name: "You", kind: "you", stack, cards: [null, null] });
      $("board").replaceChildren();
      $("pot").textContent = "";
      $("banner").textContent = "";
      betEl($("bot-bet"), 0); betEl($("you-bet"), 0);
      $("dealer").hidden = true;
      const big = el("div", "big");
      const sit = el("button", "btn", busy ? "Dealing…" : "Deal me in");
      sit.disabled = busy; sit.onclick = deal; sit.dataset.key = " ";
      big.append(sit);
      actions.append(big, el("div", "alert", error));
      renderChat(null);
      return;
    }

    const h = hand, me = h.human_seat, bot = 1 - me, live = !h.over;
    const put = streetCommitments(h);
    const stacks = live || h.payoff == null
      ? h.stacks
      : [0, 1].map((seat) => run.starting_stack + (seat === me ? h.payoff : -h.payoff));

    seatEl($("bot-seat"), {
      name: "Blueprint", kind: "bot", stack: BB(stacks[bot]),
      cards: h.bot_hole_cards || ["back", "back"], active: h.to_act === bot, said: lastSaid(h, "bot"),
    });
    seatEl($("you-seat"), {
      name: "You", kind: "you", stack: BB(stacks[me]), cards: h.hole_cards,
      active: h.to_act === me, said: lastSaid(h, "human"),
    });
    const dealer = $("dealer");
    dealer.hidden = false;
    dealer.className = "dealer " + (h.button === me ? "bottom" : "top");

    $("board").replaceChildren(...h.board.map((c, i) => cardEl(c, "b" + i)));
    const middle = live ? h.pot - put[0] - put[1] : h.pot;
    // The result banner takes the pot's place once the pot has been pushed.
    $("pot").textContent = middle > 0 && live ? "Pot: " + BB(middle) : "";
    betEl($("bot-bet"), live ? put[bot] : 0);
    betEl($("you-bet"), live ? put[me] : 0);

    const banner = $("banner");
    if (h.over && h.payoff != null) {
      banner.textContent = h.payoff > 0 ? `You win ${BB(h.payoff)}` : h.payoff < 0 ? `Blueprint wins ${BB(-h.payoff)}` : "Split pot";
      const big = el("div", "big");
      const next = el("button", "btn", busy ? "Dealing…" : "Deal next hand");
      next.disabled = busy; next.onclick = deal; next.dataset.key = " ";
      big.append(next);
      actions.append(big);
    } else {
      banner.textContent = "";
      if (h.to_act === me && h.legal.length) renderActions(actions, h, put);
      else actions.append(el("div", "waiting", "Blueprint is acting…"));
    }
    actions.append(el("div", "alert", error));
    renderChat(h);
  }

  // The bet panel of an online client: presets, a slider, and three buttons.
  // The slider only stops on sizes the solver was trained with -- the bot has no
  // strategy for anything in between.
  function renderActions(actions, h, put) {
    const me = h.human_seat, opp = 1 - me;
    const owe = put[opp] - put[me];
    const sizes = [];
    let fold = null, passive = null;
    for (const edge of h.legal) {
      if (edge.type === "fold") fold = edge;
      else if (edge.type === "check" || edge.type === "call") passive = edge;
      else {
        const to = applyEvent(put, { seat: me, action: edge.type, amount: edge.amount })[me];
        if (edge.type === "all_in" && to <= put[opp]) passive = edge;   // calling a shove
        else sizes.push({ edge, to, allIn: edge.type === "all_in" });
      }
    }
    sizes.sort((a, b) => a.to - b.to);
    if (pick == null || pick >= sizes.length) pick = 0;
    const raising = put[me] || put[opp];

    if (sizes.length) {
      const presets = el("div", "presets");
      const labelFor = (s, i) => {
        if (s.allIn) return "All-in";
        if (i === 0) return "Min";
        const potAfterCall = h.pot + owe;
        const frac = (s.to - put[opp]) / potAfterCall;
        if (Math.abs(frac - 1) < 0.08) return "Pot";
        if (Math.abs(frac - 0.5) < 0.06) return "½ Pot";
        if (Math.abs(frac - 0.75) < 0.06) return "¾ Pot";
        if (Math.abs(frac - 0.33) < 0.05) return "⅓ Pot";
        return num(bbOf(s.to));
      };
      sizes.forEach((s, i) => {
        const b = el("button", "preset", labelFor(s, i));
        b.setAttribute("aria-pressed", String(i === pick));
        b.title = (raising ? "Raise to " : "Bet ") + BB(s.to);
        b.onclick = () => { pick = i; render(); };
        presets.append(b);
      });
      const slide = el("div", "slide");
      const range = el("input");
      Object.assign(range, { type: "range", min: 0, max: sizes.length - 1, step: 1, value: pick });
      range.setAttribute("aria-label", "Bet size");
      range.oninput = () => { pick = Number(range.value); render(); };
      const out = el("output", null, num(bbOf(sizes[pick].to)));
      slide.append(range, out);
      actions.append(presets, slide);
    }

    const big = el("div", "big");
    if (fold) {
      const b = el("button", "btn", "Fold");
      b.onclick = () => act(fold.token); b.disabled = busy; b.dataset.key = "f";
      big.append(b);
    }
    if (passive) {
      const b = el("button", "btn");
      if (passive.type === "check") b.textContent = "Check";
      else { b.append(passive.type === "all_in" ? "Call all-in" : "Call", el("small", null, BB(owe))); }
      b.onclick = () => act(passive.token); b.disabled = busy; b.dataset.key = "c";
      big.append(b);
    }
    if (sizes.length) {
      const s = sizes[pick];
      const b = el("button", "btn");
      b.append(s.allIn ? "All-in" : raising ? "Raise to" : "Bet", el("small", null, BB(s.to)));
      b.onclick = () => act(s.edge.token); b.disabled = busy; b.dataset.key = "r";
      big.append(b);
    }
    actions.append(big);
  }

  // The dealer's running commentary, the way a client narrates a hand.
  function renderChat(h) {
    const chat = $("chat");
    chat.replaceChildren();
    const line = (cls, ...parts) => { const p = el("p", cls); p.append(...parts); chat.append(p); };
    if (!h) {
      line("muted", "Heads-up against Blueprint, a bot trained by counterfactual regret minimisation. The button alternates and stacks reset every hand.");
      line("muted", "Keys: F fold · C check/call · R bet/raise · ← → size · Space deal.");
      return;
    }
    const name = (actor) => (actor === "human" ? el("span", "you", "You") : el("span", null, "Blueprint"));
    // Third person is the default phrasing; "You" takes the plain verb.
    const verb = (actor, text) => (actor === "human" ? text.replace("is all-in", "are all-in").replace(/^(\w+?)s\b/, "$1") : text);
    const youBtn = h.button === h.human_seat;
    line("dealer-says", `Dealer: Hand #${handNo} — ${youBtn ? "you are" : "Blueprint is"} on the button`);
    const sb = youBtn ? "human" : "bot", bb = youBtn ? "bot" : "human";
    line(null, name(sb), " " + verb(sb, `posts small blind ${BB(run.small_blind)}`));
    line(null, name(bb), " " + verb(bb, `posts big blind ${BB(run.big_blind)}`));
    line("dealer-says", "Dealer: Dealing hole cards: ", ...h.hole_cards.flatMap((c, i) => (i ? [" ", cardText(c)] : [cardText(c)])));
    const boardAt = { flop: [0, 3], turn: [3, 4], river: [4, 5] };
    let street = "preflop", put = blindsPut(h.button);
    for (const e of h.log) {
      if (e.street !== street) {
        street = e.street; put = [0, 0];
        const [from, to] = boardAt[street] || [0, 0];
        line("dealer-says", `Dealer: Dealing ${street}: `, ...h.board.slice(from, to).flatMap((c, i) => (i ? [" ", cardText(c)] : [cardText(c)])));
      }
      line(null, name(e.actor), " " + verb(e.actor, phrase(e.action, e.amount, put, e.seat)));
      put = applyEvent(put, e);
    }
    if (h.over) {
      // Board cards run out after an all-in never appear in the log; name them.
      const shown = { preflop: 0, flop: 3, turn: 4, river: 5 }[street] || 0;
      if (h.board.length > shown) line("dealer-says", "Dealer: Running out the board: ", ...h.board.slice(shown).flatMap((c, i) => (i ? [" ", cardText(c)] : [cardText(c)])));
      if (h.bot_hole_cards) line(null, name("bot"), " shows ", ...h.bot_hole_cards.flatMap((c, i) => (i ? [" ", cardText(c)] : [cardText(c)])));
      const text = h.payoff > 0 ? `Dealer: You win ${BB(h.payoff)}` : h.payoff < 0 ? `Dealer: Blueprint wins ${BB(-h.payoff)}` : "Dealer: Split pot";
      line("result", text);
    }
    chat.scrollTop = chat.scrollHeight;
  }

  // ---- keyboard --------------------------------------------------------------
  document.addEventListener("keydown", (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey || event.repeat) return;
    if (event.target instanceof HTMLInputElement && event.key.startsWith("Arrow")) return;
    const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    if ((key === "ArrowLeft" || key === "ArrowRight") && pick != null) {
      const n = $("actions").querySelectorAll(".preset").length;
      if (n) { pick = Math.max(0, Math.min(n - 1, pick + (key === "ArrowRight" ? 1 : -1))); render(); event.preventDefault(); }
      return;
    }
    const target = document.querySelector(`#actions [data-key="${CSS.escape(key)}"]:not(:disabled)`);
    if (target) { event.preventDefault(); target.click(); }
  });

  window.addEventListener("pagehide", () => {
    if (hand && !hand.over) {
      try { fetch(`/api/play/${encodeURIComponent(hand.session)}`, { method: "DELETE", keepalive: true }); } catch (_) { /* ignore */ }
    }
  });

  call("GET", "/api/run")
    .then((payload) => { run = payload; render(); })
    .catch(() => { error = "The table is closed right now. Try again in a few minutes."; render(); });
  render();
})();
</script>
</body>
</html>
