# OCHS gate — CONTROL arm (scalar equity, the current production feature).
#
# Paired with ochs_gate_ochs.yaml, which differs in exactly one field:
# river_feature. Everything else is held fixed so an exploitability difference
# between the two is attributable to the river feature and nothing else.
#
# Bucket counts are deliberately small. The point of this abstraction is not to
# be strong; it is to be small enough that a blueprint trained on it actually
# CONVERGES (~971 regret updates per infoset at 2M iterations against the gate's
# 20bb / 2-raise betting tree), so the comparison measures the abstraction
# rather than which arm happened to be less under-trained.

buckets:
  flop: 20
  turn: 20
  river: 20

# Exact flop equities: the control must not carry sampling error the OCHS arm
# does not.
flop_runouts: null

equity_histogram_bins: 8

river_feature: scalar_equity

kmeans_max_iter: 300
kmeans_n_init: 10

num_workers: null
seed: 42
