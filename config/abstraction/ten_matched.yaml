# The size-matched imperfect-recall control for the recall probe: the same row
# count as `path` recall over `ten` (10 / 100 / 1,000), spent on finer
# per-street buckets instead of on remembering the path. Waugh et al. (2009)
# is the comparison: recall against equal size, not against fewer rows.

buckets:
  flop: 10
  turn: 100
  river: 1000

flop_runouts: null
equity_histogram_bins: 8

kmeans_max_iter: 500
kmeans_n_init: 20

num_workers: null
seed: 42
