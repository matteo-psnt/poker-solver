# 4x production's flop and turn resolution, river held at 600.
#
# WHY THE RIVER IS HELD. River nodes are 70,884 of the fixed tree's 81,518, so
# the river owns 93.4% of the table: doubling every street (production_xl) spends
# 93% of its extra rows there, and scalar equity is already saturated at 600
# (variance explained 0.999999, within-bucket sigma 0.00035). XL therefore halved
# visits/row to buy resolution its own feature cannot express. Refining flop+turn
# 4x instead costs 1.20x the rows -- visits/row 0.83x rather than 0.50x.
#
# Flop/turn have real headroom at production: variance explained 0.9934/0.9945,
# within-bucket sigma 0.0161/0.0176. XL's 2x cut flop sigma 14%; this measures
# whether 4x keeps paying.

buckets:
  flop: 400
  turn: 1200
  river: 600

flop_runouts: null
equity_histogram_bins: 8

kmeans_max_iter: 500
kmeans_n_init: 20

num_workers: null
seed: 42
