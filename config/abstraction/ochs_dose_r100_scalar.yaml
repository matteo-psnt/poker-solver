# OCHS river dose-response, r=100 — CONTROL arm (scalar-equity river).
#
# Identical to ochs_gate_scalar.yaml except river buckets 20 -> 100. Flop and
# turn stay at 20 deliberately: OCHS is a RIVER feature, so holding the other
# streets fixed makes river bucket count the only variable and keeps this
# directly comparable to the r=20 gate point.
#
# Why r=100: the equity fidelity OCHS surrenders shrinks with bucket count
# (measured, river, 1500 boards) —
#   r=20  gap 0.013011   <- where OCHS lost by 10.5%
#   r=100 gap 0.004400   <- here, ~3x cheaper
#   r=600 gap 0.000995   <- production
# so this is the cheapest point that materially moves along that curve. It is
# NOT expected to be decisive; it tests whether the sign moves in the direction
# the saturation premise predicts as the price drops.
#
# Cost: ~5.18M betting-tree rows (32*169 + 644*20 + 6620*20 + 50308*100) versus
# the gate's 298,472 — the river owns 50,308 of 57,604 nodes, so river buckets
# drive the table size almost entirely.

buckets:
  flop: 20
  turn: 20
  river: 100

flop_runouts: null

equity_histogram_bins: 8

river_feature: scalar_equity

kmeans_max_iter: 300
kmeans_n_init: 10

num_workers: null
seed: 42
