# OCHS gate — TREATMENT arm (Opponent Cluster Hand Strength on the river).
#
# Identical to ochs_gate_scalar.yaml except for river_feature. That is the whole
# experiment: same bucket counts, same flop/turn treatment, same seed, same
# k-means settings, so the infoset count is identical and any exploitability
# difference isolates the river feature.
#
# Note the bucket count does NOT change. OCHS swaps what is being clustered, not
# how many clusters there are, so this costs nothing in infosets — which is why
# it is preferable to board-texture conditioning, where texture classes would
# have to be paid for out of the equity-strata budget.

buckets:
  flop: 20
  turn: 20
  river: 20

flop_runouts: null

equity_histogram_bins: 8

river_feature: ochs
# 8 opponent clusters is the count used in the originating work
# (Johanson, Burch, Valenzano & Bowling, AAMAS 2013).
ochs_clusters: 8

kmeans_max_iter: 300
kmeans_n_init: 10

num_workers: null
seed: 42
