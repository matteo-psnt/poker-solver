# 8x production's flop and turn resolution, river held at 600. The far rung of the
# flop/turn ladder whose near rung is production_f4 -- see that file for why the
# river is not refined. 1.46x the rows, visits/row 0.68x.
#
# F800 pushes the flop matrix past 255 buckets, so it stores as uint16 rather than
# uint8 (`bucket_dtype`, sentinel-safe below 65,535). That is 2.3 MB -> 4.7 MB on
# the flop, immaterial beside the river's 340 MB.
#
# Pluribus's blueprint used 200 buckets per postflop round over 1,286,792 lossless
# flop situations = 6,434 per bucket. F800 is 1,706 per bucket, i.e. ~3.8x finer
# than Pluribus's blueprint on the flop.

buckets:
  flop: 800
  turn: 2400
  river: 600

flop_runouts: null
equity_histogram_bins: 8

kmeans_max_iter: 500
kmeans_n_init: 20

num_workers: null
seed: 42
