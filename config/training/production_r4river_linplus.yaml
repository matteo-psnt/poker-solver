# TREATMENT arm: the fielded CFR-BR trainer, with DCFR's schedule swapped for
# linear weighting over a CFR+ floor ("linplus").
#
# The fielded blueprint trains `iteration_weighting: dcfr`, and three separate
# measurements say that is the wrong schedule:
#
#   - Plain PCS, 3 seeds, CRN-paired: linplus beats dcfr by +212 mbb at rung
#     2,000, same sign in 3/3 seeds, crossing over at ~800.
#   - On 10-bucket abstractions every arm DEGRADES past its minimum, and the
#     schedule is what governs how much: DCFR +262 mbb, linplus +38.
#   - The CFR+ floor ALONE does not stop that drift; `dcfrplus` still drifts.
#     It is the weighting schedule, not the floor.
#
# None of that was measured under CFR-BR, which is what actually trains the
# fielded blueprint -- the note recording the drift says so in as many words:
# "CFR-BR still trains DCFR -- untested with linplus." This arm tests it.
#
# ONE variable moves against `production_r4river.yaml`: the two knobs that
# together make up linplus, which the drift probe treats as a single arm
# because isolating them was already done there (`dcfrplus` drifts like DCFR).
#
# A config file rather than `--set` flags on purpose: `--set` is DROPPED on
# resume, and a multi-task run that silently reverts halfway measures nothing.

extends: production_r4river.yaml

solver:
  iteration_weighting: linear
  cfr_plus: true

system:
  config_name: "production_r4river_linplus"
