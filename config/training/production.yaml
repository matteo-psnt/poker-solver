# Production Training Configuration for HUNLHE Solver
# Uses Discounted CFR (DCFR) for faster convergence than Linear/vanilla CFR.
#
# (Convergence targets removed: earlier per-iteration mbb/g estimates came from the
# legacy rollout estimator and are not trustworthy; use LBR after training instead.)

solver:
  iteration_weighting: dcfr

action_model:
  preflop_templates:
    sb_first_in: ["fold", "call", 2.5, 3.5, 5.0]
    # Sizes are chips committed by this action in bb: the BB's 2.0 / 3.0 over
    # a limp are raises to 3bb / 4bb total.
    bb_vs_limp: ["check", 2.0, 3.0]
    sb_vs_limp_raise: ["fold", "call", "2.3x_last", "jam"]
    bb_vs_open: ["fold", "call", "3.5x_open", "4.5x_open"]
    sb_vs_3bet: ["fold", "call", "2.3x_last", "jam"]
  postflop_templates:
    first_aggressive: [0.33, 0.66, 1.25]
    facing_bet: ["min_raise", "pot_raise", "jam"]
    after_one_raise: ["pot_raise", "jam"]
    after_two_raises: ["jam"]

resolver:
  max_raises_per_street: 5

card_abstraction:
  config: production

training:
  num_iterations: 1000000

storage:
  initial_capacity: 4000000
  # Spare one checkpoint per 10M iterations from pruning, so a run ends holding a
  # ladder (10M, 20M, ...) instead of only its final snapshot -- this is what makes
  # a within-run exploitability-vs-iterations curve possible (`evaluate --at N`).
  # Each rung is a full table (~840 MB at production size) PUBLISHED to the share,
  # and the upload is the wall-clock of a short run. Must stay a multiple of the
  # chunk size (`--checkpoint-every`, 5M by default); below it nothing is pruned.
  checkpoint_retain_every: 10000000

system:
  config_name: "production"
