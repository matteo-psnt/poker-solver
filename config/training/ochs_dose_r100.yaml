# OCHS river dose-response at r=100 — training side.
#
# Defaults to the CONTROL abstraction so the arm is a single override:
#
#   uv run poker-solver-run ab --config ochs_dose_r100 --iterations 500000 --seed 42 \
#     --arm 'ochs:card_abstraction__config=ochs_dose_r100_ochs'
#
# Matches config/training/ochs_gate.yaml in every solver setting, so the r=20
# and r=100 points differ only in river bucket count and are directly
# comparable as a dose-response.
#
# Table size: 1,365,992 rows versus the gate's 298,472 — 4.6x, on the DEFAULT
# action model's 14,864 nodes (this config does not select production's action
# model, so it does not get production's 57,604). MEASURED at 1M iterations,
# single worker: 96.4% coverage, 17.3 visits per touched row — better-trained
# than the gate run's 90.2%, not worse as an earlier version of this comment
# predicted from the wrong node counts.

solver:
  # No discounting: keeps regrets accumulating linearly, so the comparison is
  # not entangled with a weighting schedule.
  iteration_weighting: none

card_abstraction:
  config: ochs_dose_r100_scalar

system:
  seed: 42
  config_name: "ochs_dose_r100"
