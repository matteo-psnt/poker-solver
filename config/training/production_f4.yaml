# Production action model with the production_f4 card abstraction (400/1200/600). The action model is
# copied VERBATIM from production.yaml so `action_config_hash` matches and an
# exact_br score on this run's tree is a matched tier against production.

solver:
  iteration_weighting: dcfr

action_model:
  preflop_templates:
    sb_first_in: ["fold", "call", 2.5, 3.5, 5.0]
    bb_vs_open: ["fold", "call", "3.5x_open", "4.5x_open"]
    sb_vs_3bet: ["fold", "call", "2.3x_last", "jam"]
  postflop_templates:
    first_aggressive: [0.33, 0.66, 1.25]
    facing_bet: ["min_raise", "pot_raise", "jam"]
    after_one_raise: ["pot_raise", "jam"]
    after_two_raises: ["jam"]

resolver:
  max_raises_per_street: 5

card_abstraction:
  config: production_f4

training:
  num_iterations: 1000000

storage:
  initial_capacity: 4000000
  checkpoint_retain_every: 1000000

system:
  config_name: "production_f4"
