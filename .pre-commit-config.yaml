# Pre-commit hooks for code quality
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/.*\.txt$
      - id: end-of-file-fixer
        exclude: ^tests/.*\.txt$
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Ruff - fast auto-fix linting followed by formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Type checking with ty
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty
        language: system
        pass_filenames: false
        args: [check]
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
      - id: deptry
        name: deptry
        entry: uv run deptry
        language: system
        pass_filenames: false
        args: [src, --known-first-party, src]
      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        pass_filenames: false
        args: [src, --min-confidence, "70"]
      # The contract the console reads, regenerated from the app itself. Runs on
      # EVERY commit and not just a console one: the models live in Python, so
      # the change that makes this file stale is usually a change with no
      # `console/` path in it at all -- which is exactly how it went stale while
      # `types.gen.ts` was rebuilt by hand. Writes and fails; staging the result
      # puts a `console/` file in the commit, which is what makes the hook below
      # regenerate `types.gen.ts` from it.
      - id: openapi-export
        name: openapi.json (regenerate from the app)
        entry: uv run python -m src.interfaces.web.schema
        language: system
        pass_filenames: false
      # The console's gate. Its own toolchain -- ruff/ty/deptry/vulture never
      # see JavaScript -- but it runs beside them so one command still answers
      # "is this repo clean". `files:` spares a Python-only checkout: with no
      # console file staged the hook never fires. With deps missing it fails
      # (npm exits 127 on the first missing binary) rather than passing having
      # checked nothing, which is what a wrapper script used to do here.
      - id: console
        name: console (biome + tsc + vitest)
        entry: npm --prefix console run ci
        language: system
        pass_filenames: false
        files: ^console/
