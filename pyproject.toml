[project]
name = "poker-solver"
version = "0.1.0"
description = "Heads-Up No-Limit Hold'em solver using Monte Carlo CFR"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Matteo Pesenti" }
]
dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "scipy>=1.15.3",
    "scikit-learn==1.7.2",
    "numba>=0.63.1",
    "xxhash>=3.6.0",
    "zarr<3",
    "numcodecs<0.16",
    "eval7>=0.1.10",
    "pydantic>=2.0",
    "azure-batch>=15.1.0",
    "azure-identity>=1.25.3",
    "azure-storage-file-share>=12.26.0",
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
]

[project.scripts]
poker-solver-run = "src.interfaces.cli.headless:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",    # builtin shadowing
    "ARG",  # unused arguments
    "B",    # bugbear: likely bugs (B905 = zip without strict=)
    "BLE",  # blind except -- deliberate ones carry `# noqa: BLE001 -- <why>`
    "C4",   # comprehension / literal misuse
    "DTZ",  # naive datetimes -- the ledger already has a naive-local-time era
    "E",
    "F",
    "FLY",  # static join -> f-string
    "G",    # logging format
    "I",
    "ICN",  # import naming conventions
    "INT",  # gettext
    "ISC",  # implicit string concat
    "LOG",  # logging misuse
    "N",
    "PERF", # obvious perf smells
    "PGH",  # blanket noqa / type: ignore with no code
    "PIE",
    "PT",   # pytest style
    "PTH",  # os.path -> pathlib
    "Q",    # quote style
    "RET",
    "RSE",  # raise X() -> raise X
    "RUF",
    "SIM",
    "SLF",
    "SLOT", # __slots__ misuse
    "TID",  # tidy imports
    "UP",
    "W",
]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    # G004 (f-string in a log call) does not pay for itself here: every such
    # line uses `{n:,}` formatting, which %-style cannot express, so the lazy
    # form would be `logger.info("%s rows", f"{n:,}")` -- worse to read, and
    # these are once-per-checkpoint lines, not a hot path. The rest of G still
    # catches real misuse (string concat / .format() in a log call).
    "G004",
    # ERA001 cannot tell a worked example from dead code, and this codebase
    # explains its arithmetic in comments: "# e_i = (u0 + u1) / 2" reads as
    # commented-out code to it. All four hits were false positives.
    "ERA001",
]

[tool.ruff.lint.per-file-ignores]
"*.py" = ["E501"]
# Tests are full of deliberately-unused arguments: monkeypatch stand-ins that
# must match a real signature, and fixtures requested for their side effect.
"tests/**/*.py" = ["SLF001", "ARG001", "ARG002", "ARG005"]
# The node-side wrapper and leg_log are run by the BATCH NODE's system python3,
# which on the pinned Ubuntu 22.04 image is 3.10 -- not the target above. UP017
# rewrites `timezone.utc` to `datetime.UTC`, which is 3.11+, and the call site
# swallows the resulting ImportError: the leg records simply stop appearing.
# tests/shared/node/test_node_interpreter.py imports both on a real 3.10.
"src/shared/leg_log.py" = ["UP017"]
"src/shared/node/*.py" = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "timeout: test timeout in seconds",
]
addopts = "-v"
timeout = 5
timeout_func_only = true

[dependency-groups]
# Development, testing, and code quality tools
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.9",
    "ty",
    "pre-commit>=4.5.1",
    "types-pyyaml>=6.0.12.20250915",
    "types-tqdm>=4.67.0.20250809",
    "pytest-timeout>=2.4.0",
    "httpx>=0.28.0",
    "import-linter>=2.10",
    "deptry>=0.24.0",
    "vulture>=2.14",
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
source = ["src"]
# Workers are separate processes; without this they report nothing.
concurrency = ["multiprocessing"]
parallel = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.$",
]

[tool.uv]
preview = true

[tool.uv.extra-build-dependencies]
eval7 = ["Cython"]
