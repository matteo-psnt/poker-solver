# What the chipzen seat plays, and the chart on the box reads. The ONLY place it
# is set: a change here is a commit, and GitHub deploys it outside the
# 00:00-05:00 UTC match window (.github/workflows/deploy.yml).
#
# `at` is a rung number or "latest", the newest rung the checkpoints container
# holds, followed every 2 h while a run trains (user, 10-17: field the latest
# rung of every depth). `poker-solver seat-plan` resolves it.
#
# The base run plays every depth deeper than the shallowest rung below; each
# rung is `run:at:threshold`, and the seat takes the one nearest in log depth.
# Thresholds purify the policy; why 0.35 deep and 0.20 shallow is in memory
# (purification-is-worth-more-than-the-ladder).

# 3-bets sized off the open (production_3bets), run b. 4 seeds x 20,000 deals (11-05):
# @61600 vs run a @36800 (the previous base) +71.2 +/- 19.9, vs run a @61600 +55.3 +/- 19.9.
# Pinned: a rung is fielded only after its gate.
run = "run-pcs-production_3bets-to12k-d100-b-070744-26295"
at = 61600
threshold = 0.35

rungs = [
    # each @50000 vs its own fielded @12000, 4 seeds x 20,000 deals, mbb/hand (11-05):
    "run-pcs-production_3bets-to12k-d50-200257-29329:50000:0.35",  # +71.5 +/- 16.0
