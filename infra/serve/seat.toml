# What the chipzen seat plays, and the chart on the box reads. The ONLY place it
# is set: a change here is a commit, and GitHub deploys it outside the
# 00:00-05:00 UTC match window (.github/workflows/deploy.yml).
#
# `at` is a rung number or "latest", the newest rung the checkpoints container
# holds, followed every 2 h while a run trains (user, 10-17: field the latest
# rung of every depth). `poker-solver seat-plan` resolves it.
#
# The base run plays every depth deeper than the shallowest rung below; each
# rung is `run:at:threshold`, and the seat takes the one nearest in log depth.
# Thresholds purify the policy; why 0.35 deep and 0.20 shallow is in memory
# (purification-is-worth-more-than-the-ladder).

# 3-bets sized off the open (production_3bets); at 24000 vs 6584@75000, 4 seeds x
# 20,000 deals x 2 arms: +59.7 mbb/hand, 8/8 positive (10-30).
run = "run-pcs-production_3bets-to12k-d100-a-070733-27232"
at = "latest"
threshold = 0.35

rungs = [
    # 3-bets sized off the open; vs 17367@50000, 4 seeds x 20,000 deals: +93.8 +/- 16.5 (11-01)
    "run-pcs-production_3bets-to12k-d50-200257-29329:12000:0.35",
    # production_3bets@12000 vs production_opens@50000, 4 seeds x 20,000 deals, mbb/hand (11-02):
    "run-pcs-production_3bets-to12k-d35-163322-3053:12000:0.20",  # +43.7 +/- 13.5
    "run-pcs-production_3bets-to12k-d25-163332-28894:12000:0.20",  # +34.2 +/- 10.0
    "run-pcs-production_3bets-to12k-d15-163342-330:12000:0.20",  # +29.6 +/- 7.4
    "run-pcs-production_3bets-to12k-d10-163351-30081:12000:0.20",  # +12.5 +/- 4.9
    "run-pcs-production_3bets-to12k-d06-163359-17879:12000:0.20",  # +5.9 +/- 2.5
    "run-pcs-production_3bets-to12k-d03-163408-7671:12000:0.20",  # +2.2 +/- 1.0
]
